<!-- Menu bar status item glyph. Template image: only alpha matters, macOS tints it
     to the menu bar's foreground. Same monitor as logo.svg with the two resize
     marks knocked out. Nominal size 18x18 pt; drawn on a 36x36 grid (@2x). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="18" height="18">
  <defs>
    <mask id="marks">
      <rect width="36" height="36" fill="#fff"/>
      <!-- Resize corner top-left -->
      <path d="M7.5 15 V10.5 H12" fill="none" stroke="#000" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Resize corner bottom-right -->
      <path d="M28.5 16 V20.5 H24" fill="none" stroke="#000" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
  </defs>
  <!-- Monitor -->
  <rect x="2" y="5" width="32" height="21" rx="3.2" fill="#000" mask="url(#marks)"/>
  <!-- Stand -->
  <rect x="15" y="26" width="6" height="3.5" fill="#000"/>
  <rect x="10" y="29" width="16" height="2.4" rx="1.2" fill="#000"/>
</svg>
