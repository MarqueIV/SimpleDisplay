<!-- Menu bar status item glyph. Template image: only alpha matters, macOS tints it
     to the menu bar's foreground. Same monitor as logo.svg with the two resize
     marks knocked out. Nominal size 18x18 pt; drawn on a 36x36 grid (@2x).
     The marks are deliberately bold (3.6 units, long arms): at 1x (18 px, non-Retina
     menu bars) thinner marks blur into a plain monitor and the glyph reads as generic. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="18" height="18">
  <defs>
    <mask id="marks">
      <rect width="36" height="36" fill="#fff"/>
      <path d="M8 17 V9.5 H15.5" fill="none" stroke="#000" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M28 13 V20.5 H20.5" fill="none" stroke="#000" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
  </defs>
  <rect x="2" y="3.5" width="32" height="23" rx="3.5" fill="#000" mask="url(#marks)"/>
  <rect x="15" y="26.5" width="6" height="3.5" fill="#000"/>
  <rect x="10" y="29.5" width="16" height="2.5" rx="1.25" fill="#000"/>
</svg>
